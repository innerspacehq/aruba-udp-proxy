version: "3.6"
services:
    udp-proxy:
        image: innerspace/udp-proxy:1.0.1
        container_name: innerspace-udp-proxy
        domainname: innerspace-udp-proxy
        restart: unless-stopped
        env_file:
            - .env
        deploy:
            resources:
                limits:
                    memory: "1G"
                    cpus: "1"
        ports:
            - "${HOST}:${PORT}:${PORT}/udp"
        expose:
            - "${PORT}"
        command: python src/udp_proxy.py
